<body style="background-color:black;">
{% extends "base.html" %}
{% block content %}
<div class = "container" style="background-color:#7DF9F9 ;margin:10px;">
    <h1>Have a puppy that needs to be adopted?</h1>

    <form method="post">
        {{form.hidden_tag()}}
        <div class="row mt-5" style="background-color:#21B1B1   ;">
            <div class="col-1"></div>
            <div class="col-3">

                {{form.name.label()}}
            </div>
            <div class="col-3" >
                {{form.name()}}
             </div>
        </div>

        <div class="row mt-3" style="background-color:#21B1B1 ">
            <div class="col-1"></div>
            <div class="col-3">

                {{form.age.label()}}
            </div>
            <div class="col-3" >
                {{form.age()}}
             </div>
        </div>

        <div class="row  mt-3" style="background-color:#21B1B1 ">
            <div class="col-1"></div>
            <div class="col-3">

                {{form.breed.label()}}
            </div>
            <div class="col-3" >
                {{form.breed()}}
             </div>
        </div>
        <div class = "row mt-3">
            <div class="col-5"></div>

            <div class="col-3 mb-3" style = "color:grey;">
                {{form.submit()}}
            </div>
        </div>


    </form>
</div>
{% endblock %}


</body>
