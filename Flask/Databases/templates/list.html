{% extends "base.html" %}
{% block content %}
<script>
    pup_delete_url = '';


    function yesClick(){
        $("#exampleModal").modal("hide");
        window.location.href = pup_delete_url;
    }
    function launchConfirmation(newUrl){
        pup_delete_url = newUrl;
        $("#exampleModal").modal("show");

        console.log(pup_delete_url);
        return false;
    }
</script>
    <div class = "container">
        <h1>Here is a list of all available puppies</h1>
        <div class="row">
            <div class="col-10"></div>
            <div class="col-2">
                <button class="btn btn-primary">
                <a class="text-dark" href="{{url_for('add_pup')}}">
                    <i class="fa-solid fa-plus"></i>
                    Add pup </a>
                </button>
            </div>
        </div>
        <table class="table table-hover table-striped">
            <thead>
          <tr>
              <th>Name</th>
              <th>ID</th>
              <th>Age</th>
              <th>Breed</th>
              <th>Action</th>
          </tr>
            </thead>
            <tbody>
            {%for pup in puppies %}
                <tr>
                    <td>{{pup.name}}</td>
                    <td>{{pup.id}}</td>
                    <td>{{pup.age}}</td>
                    <td>{{pup.breed}}</td>
                    <td>
                        <button onclick="launchConfirmation('{{url_for('delete_pup', id=pup.id) }}')" class="btn btn-outline-primary" title="To delete">
                            <i class="fa-solid fa-minus"></i>
                        </button>
                         <button onclick="launchConfirmation('{{url_for('delete_pup', id=pup.id) }}')" class="btn btn-outline-primary"  title="To edit">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </button>
                    </td>

                </tr>
            {% endfor %}
            </tbody>
        </table>

<button type="button" class="btn btn-primary" onclick="launchConfirmation(1);">
  Launch demo modal
</button>


    </div>

<!-- Modal -->
<div class="modal fade" id="exampleModal"  role="dialog"
     tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="exampleModalLabel">Pets delete confirmation</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        Are you sure to delete?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
        <button type="button" class="btn btn-primary" id="btn-yes" onclick="yesClick()">

            Yes</button>
      </div>
    </div>
  </div>
</div>

{% endblock %}
